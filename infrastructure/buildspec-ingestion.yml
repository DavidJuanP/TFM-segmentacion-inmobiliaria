version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install boto3 requests

  build:
    commands:
      - echo "Iniciando ingesta de datos raw"
      - python -m src.ingestion.ign_municipios
      - python -m src.ingestion.ine_edad
      - python -m src.ingestion.ine_migracion
      - python -m src.ingestion.ine_poblacion
      - python -m src.ingestion.ine_renta
      - python -m src.ingestion.ine_tamanio_hogar
      - python -m src.ingestion.ine_viviendas_turisticas
      - python -m src.ingestion.ine_viviendas
      - python -m src.ingestion.mir_criminalidad
      - python -m src.ingestion.mir_okupacion
      - python -m src.ingestion.mivau_alquiler
      - python -m src.ingestion.mivau_transacciones_municipales
      - python -m src.ingestion.sepe_paro
      - echo "Ingesta de datos raw finalizada"
