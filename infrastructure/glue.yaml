AWSTemplateFormatVersion: "2010-09-09"

Description: Jobs de AWS Glue para ejecutar los scripts de procesamiento del TFM.

Parameters:
  ProjectName:
    Type: String
    Default: tfm
    AllowedPattern: "[a-zA-Z0-9-]+"

  RawDataBucketName:
    Type: String
    Description: Bucket S3 que contiene los datos en crudo.

  ProcessedDataBucketName:
    Type: String
    Description: Bucket S3 donde se guardan los datos procesados.

  ScriptsBucketName:
    Type: String
    Description: Bucket S3 que contiene los scripts de procesamiento.

  CommonPythonModules:
    Type: String
    Default: "pyarrow==12.0.1,openpyxl==3.1.2,xlrd==2.0.1"

  GeoPythonModules:
    Type: String
    Default: "basemap==1.3.9,pyproj==3.6.1,shapely==2.0.7"

Resources:
  GlueProcessingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: acceso-s3-procesamiento
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${RawDataBucketName}"
                  - !Sub "arn:${AWS::Partition}:s3:::${ProcessedDataBucketName}"
                  - !Sub "arn:${AWS::Partition}:s3:::${ScriptsBucketName}"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${RawDataBucketName}/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${ScriptsBucketName}/*"
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ProcessedDataBucketName}/*"

  CatastroUrbanaJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub "${ProjectName}-processing-catastro-urbana"
      Role: !GetAtt GlueProcessingRole.Arn
      Command:
        Name: pythonshell
        PythonVersion: "3.9"
        ScriptLocation: !Sub "s3://${ScriptsBucketName}/processing/catastro_urbana.py"
      DefaultArguments:
        "--RAW_BUCKET": !Ref RawDataBucketName
        "--PROCESSED_BUCKET": !Ref ProcessedDataBucketName
        "--extra-py-files": !Sub "s3://${ScriptsBucketName}/utils/procesamiento_funciones.py"
        "--additional-python-modules": !Ref CommonPythonModules
        "--library-set": analytics
      ExecutionProperty:
        MaxConcurrentRuns: 1
      MaxCapacity: 1
      MaxRetries: 0
      Timeout: 120

