AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Infraestructura de almacenamiento en AWS del TFM de segmentacion inmobiliaria.
  Comprende tanto los buckets s3 para almacenar datos raw, procesados, scripts y
  resultados de consultas de Athena, como todo lo necesario para desplegar una
  base de datos en Redshift.
  Autor: David Juan Pascasio

Parameters:
  RedshiftNamespaceName:
    Type: String
    Default: redshift-tfm-curated
    AllowedPattern: "^[a-z0-9-]{3,64}$"
    Description: Nombre del namespace de Redshift Serverless.

  RedshiftWorkgroupName:
    Type: String
    Default: redshift-tfm-curated
    AllowedPattern: "^[a-z0-9-]{3,64}$"
    Description: Nombre del workgroup de Redshift Serverless.

  RedshiftDatabaseName:
    Type: String
    Default: redshift-tfm-curated
    AllowedPattern: "^[a-zA-Z][a-zA-Z_0-9+.@-]*$"
    Description: Nombre de la base de datos inicial de Redshift.

  RedshiftBaseCapacity:
    Type: Number
    Default: 32
    AllowedValues:
      - 32
      - 64
      - 128
    Description: Capacidad base y máxima del workgroup, expresada en RPUs.

Resources:

  # RawDataBucket: Bucket de S3 para almacenar datos en crudo
  RawDataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BucketName: !Sub "s3-tfm-raw-data-${AWS::AccountId}-${AWS::Region}"

      VersioningConfiguration:
        Status: Enabled

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  RawDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RawDataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt RawDataBucket.Arn
              - !Sub "${RawDataBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # ProcessedDataBucket: Bucket de S3 para almacenar datos procesados
  ProcessedDataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BucketName: !Sub "s3-tfm-processed-data-${AWS::AccountId}-${AWS::Region}"

      VersioningConfiguration:
        Status: Enabled

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  ProcessedDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProcessedDataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ProcessedDataBucket.Arn
              - !Sub "${ProcessedDataBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # ScriptsBucket: Bucket de S3 para almacenar scripts
  ScriptsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BucketName: !Sub "s3-tfm-scripts-${AWS::AccountId}-${AWS::Region}"

      VersioningConfiguration:
        Status: Enabled

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  ScriptsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ScriptsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ScriptsBucket.Arn
              - !Sub "${ScriptsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # AthenaResultsBucket: Bucket de S3 para almacenar resultados de consultas de Athena
  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BucketName: !Sub "s3-tfm-athena-results-${AWS::AccountId}-${AWS::Region}"

      VersioningConfiguration:
        Status: Enabled

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  AthenaResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AthenaResultsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt AthenaResultsBucket.Arn
              - !Sub "${AthenaResultsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # Redshift Serverless: almacén de la capa curated
  RedshiftVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: tfm-redshift-vpc

  RedshiftSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RedshiftVpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.20.1.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: tfm-redshift-subnet-a

  RedshiftSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RedshiftVpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.20.2.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: tfm-redshift-subnet-b

  RedshiftSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RedshiftVpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: 10.20.3.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: tfm-redshift-subnet-c

  RedshiftSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Acceso privado al workgroup de Redshift Serverless
      VpcId: !Ref RedshiftVpc
      Tags:
        - Key: Name
          Value: tfm-redshift-security-group

  RedshiftS3Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - redshift.amazonaws.com
                - redshift-serverless.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: leer-dataset-municipal-procesado
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetBucketLocation
                Resource: !GetAtt ProcessedDataBucket.Arn
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ProcessedDataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - integrado/*
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub "${ProcessedDataBucket.Arn}/integrado/*"

  RedshiftNamespace:
    Type: AWS::RedshiftServerless::Namespace
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      NamespaceName: !Ref RedshiftNamespaceName
      DbName: !Ref RedshiftDatabaseName
      AdminUsername: tfm_admin
      ManageAdminPassword: true
      DefaultIamRoleArn: !GetAtt RedshiftS3Role.Arn
      IamRoles:
        - !GetAtt RedshiftS3Role.Arn
      Tags:
        - Key: Layer
          Value: curated
        - Key: Project
          Value: tfm

  RedshiftWorkgroup:
    Type: AWS::RedshiftServerless::Workgroup
    Properties:
      WorkgroupName: !Ref RedshiftWorkgroupName
      NamespaceName: !Ref RedshiftNamespace
      BaseCapacity: !Ref RedshiftBaseCapacity
      MaxCapacity: !Ref RedshiftBaseCapacity
      EnhancedVpcRouting: false
      PubliclyAccessible: false
      Port: 5439
      SecurityGroupIds:
        - !Ref RedshiftSecurityGroup
      SubnetIds:
        - !Ref RedshiftSubnetA
        - !Ref RedshiftSubnetB
        - !Ref RedshiftSubnetC
      ConfigParameters:
        - ParameterKey: require_ssl
          ParameterValue: "true"
      Tags:
        - Key: Layer
          Value: curated
        - Key: Project
          Value: tfm

Outputs:

  RawDataBucketName:
    Description: Nombre del bucket dedicado a datos raw.
    Value: !Ref RawDataBucket
    Export:
      Name: !Sub "${AWS::StackName}-RawDataBucketName"

  RawDataBucketArn:
    Description: ARN del bucket dedicado a datos raw.
    Value: !GetAtt RawDataBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RawDataBucketArn"

  RawDataUri:
    Description: URI del bucket de datos raw.
    Value: !Sub "s3://${RawDataBucket}/"

  ProcessedDataBucketName:
    Description: Nombre del bucket dedicado a datos procesados.
    Value: !Ref ProcessedDataBucket
    Export:
      Name: !Sub "${AWS::StackName}-ProcessedDataBucketName"

  ProcessedDataBucketArn:
    Description: ARN del bucket dedicado a datos procesados.
    Value: !GetAtt ProcessedDataBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ProcessedDataBucketArn"

  ProcessedDataUri:
    Description: URI del bucket de datos procesados.
    Value: !Sub "s3://${ProcessedDataBucket}/"

  ScriptsBucketName:
    Description: Nombre del bucket dedicado a scripts.
    Value: !Ref ScriptsBucket
    Export:
      Name: !Sub "${AWS::StackName}-ScriptsBucketName"

  ScriptsBucketArn:
    Description: ARN del bucket dedicado a scripts.
    Value: !GetAtt ScriptsBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ScriptsBucketArn"

  ScriptsUri:
    Description: URI del bucket de scripts.
    Value: !Sub "s3://${ScriptsBucket}/"

  AthenaResultsBucketName:
    Description: Nombre del bucket dedicado a resultados de Athena.
    Value: !Ref AthenaResultsBucket
    Export:
      Name: !Sub "${AWS::StackName}-AthenaResultsBucketName"

  AthenaResultsBucketArn:
    Description: ARN del bucket dedicado a resultados de Athena.
    Value: !GetAtt AthenaResultsBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AthenaResultsBucketArn"

  AthenaResultsUri:
    Description: URI del bucket de resultados de Athena.
    Value: !Sub "s3://${AthenaResultsBucket}/"

  RedshiftNamespaceNameOutput:
    Description: Nombre del namespace de Redshift Serverless.
    Value: !Ref RedshiftNamespace

  RedshiftWorkgroupNameOutput:
    Description: Nombre del workgroup de Redshift Serverless.
    Value: !Ref RedshiftWorkgroup

  RedshiftDatabaseNameOutput:
    Description: Nombre de la base de datos de la capa curated.
    Value: !Ref RedshiftDatabaseName

  RedshiftEndpointAddress:
    Description: Endpoint privado del workgroup de Redshift Serverless.
    Value: !GetAtt RedshiftWorkgroup.Workgroup.Endpoint.Address

  RedshiftEndpointPort:
    Description: Puerto del workgroup de Redshift Serverless.
    Value: !GetAtt RedshiftWorkgroup.Workgroup.Endpoint.Port

  RedshiftDefaultIamRoleArn:
    Description: Rol predeterminado para COPY desde el bucket processed.
    Value: !GetAtt RedshiftS3Role.Arn

  JoinedMunicipalDatasetUri:
    Description: Parquet integrado que se cargará en la capa curated.
    Value: !Sub "s3://${ProcessedDataBucket}/integrado/municipios.parquet"
